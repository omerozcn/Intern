name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Ci-Local-Passw0rd!' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TicketSystem.sln

      - name: Build
        run: dotnet build TicketSystem.sln --no-restore --configuration Release

      - name: Test
        # The tests substitute {DATABASE} with a unique name per run.
        env:
          TEST_DB_CONNECTION: "Server=localhost,1433;Database={DATABASE};User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD || 'Ci-Local-Passw0rd!' }};TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: dotnet test TicketSystem.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TicketSystem.Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/TicketSystem.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Ci-Local-Passw0rd!' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/TicketSystem.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/TicketSystem.Web
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/TicketSystem.Web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: src/TicketSystem.Web
        # Playwright starts both servers; the API reads its connection from the environment.
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TicketSystemE2E;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD || 'Ci-Local-Passw0rd!' }};TrustServerCertificate=True;MultipleActiveResultSets=true"
          Jwt__SigningKey: e2e-workflow-signing-key-at-least-32-bytes-long
        run: npx playwright test

      - name: Upload the report when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/TicketSystem.Web/playwright-report/
          retention-days: 7
