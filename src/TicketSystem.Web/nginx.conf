server {
    # 8080 rather than 80 so the container needs no privileged port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is reached through this same origin, so the browser never makes a
    # cross-origin request and the SPA needs no VITE_API_BASE_URL override.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # vue-router runs in history mode: a deep link such as /admin/tickets is not a
    # file on disk and must still return index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
