<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Turkuvaz talep, hizmet ve geri bildirim yönetim sistemi"
    />
    <title>Turkuvaz Talep Sistemi</title>
    <!--
      Runs before the module script so the first paint is already in the right
      theme. Without it a stored dark preference flashes a white page while the
      bundle loads. Kept in sync with composables/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('turkuvaz.theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.bsTheme = dark ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0b1220' : '#0f766e')
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.bsTheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
