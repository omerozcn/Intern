services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticketsystem-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasinda tanimlanmali}
      MSSQL_PID: Developer
    ports:
      # Only needed to attach SSMS or sqlcmd from the host; the API reaches the
      # database over the compose network. Defaults off 1433 so it does not clash
      # with a SQL Server already installed on the machine.
      - "${DB_PORT:-14330}:1433"
    restart: unless-stopped
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API must not start before the server can actually answer queries.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./src/TicketSystem.Api
      dockerfile: Dockerfile
    container_name: ticketsystem-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This stack is a local demo. Seeding is what applies the migrations and creates
      # the two accounts documented in the README, so it defaults to on here — but it
      # is an explicit switch, not a side effect of the environment name. Set
      # SEED_DEVELOPMENT_ACCOUNTS=false (and migrate separately) for anything reachable,
      # and override the two passwords if you leave it on.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Seed__DevelopmentAccounts: ${SEED_DEVELOPMENT_ACCOUNTS:-true}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__UserPassword: ${SEED_USER_PASSWORD:-}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TicketSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:5005}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:5005}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY .env dosyasinda tanimlanmali}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # The web container proxies /api, so requests reach the API with the nginx
      # address. Trusting the compose network keeps rate limiting per real client.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
    ports:
      - "${API_PORT:-5005}:8080"
    restart: unless-stopped
    healthcheck:
      # /health also verifies the database connection, so a web container can wait on it.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./src/TicketSystem.Web
      dockerfile: Dockerfile
    container_name: ticketsystem-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mssql-data:
